<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard 2026 · CITE</title>
  <meta name="description" content="Seguimiento y monitoreo de metas del Plan Operativo Institucional 2026 — CITE.">

  <link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='36' width='10' height='20' rx='2' fill='%233B82F6'/%3E%3Crect x='26' y='24' width='10' height='32' rx='2' fill='%2310B981'/%3E%3Crect x='44' y='12' width='10' height='44' rx='2' fill='%23F59E0B'/%3E%3Cpath d='M8 46 L24 30 L38 34 L56 12' stroke='%23EF4444' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='56' cy='12' r='4' fill='%23EF4444'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=23">
  <style>
    /* World Vision: azul cielo, amarillo, naranja y verde. Intensidad por registros activos. */
    .wv-calendar .cal-day.on {background:#d9edff!important;color:#164a78!important;border:1px solid #8dc8f6!important;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
    .wv-calendar .cal-day.on.lv2 {background:#fff0a8!important;color:#765500!important;border-color:#edcf55!important}
    .wv-calendar .cal-day.on.lv3 {background:#ffd0a1!important;color:#84420b!important;border-color:#f5a45d!important}
    .wv-calendar .cal-day.on.lv4 {background:#bcebc2!important;color:#205a30!important;border-color:#65c77a!important}
    .wv-calendar .cal-day.on:hover {transform:translateY(-2px);box-shadow:0 4px 12px #2c5c9c33!important;filter:saturate(1.3)}
    .wv-calendar .cal-day.on.sel {background:#337bc9!important;color:#fff!important;border-color:#19538e!important;box-shadow:inset 0 0 0 2px #184c84!important}
    .wv-calendar .cal-cnt {background:#315f9b!important;color:#fff!important;border-radius:12px;padding:0 4px}
    .wv-calendar .cal-day.sel .cal-cnt {background:#123c70!important}
    .wv-themes {display:flex;flex-wrap:wrap;gap:10px;padding:8px 0}
    .wv-theme {display:inline-flex;align-items:center;gap:8px;border:1px solid #bdd8f4;background:#f0f7ff;color:#244d78;border-radius:24px;padding:8px 12px;font-size:13px;max-width:100%;overflow-wrap:anywhere}
    .wv-theme i,.wv-key-dot {width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
    .wv-theme b {background:#dcecff;padding:2px 7px;border-radius:10px}
    .wv-calendar-key {display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;color:#305a86;font-size:13px}
    .wv-key-dot {background:#77b6ee}.wv-key-hint {color:#64748b;margin-left:12px}
  </style>
</head>
<body>
  <div class="shell">
    <!-- RIEL DE NAVEGACIÓN -->
    <aside class="rail">
      <div class="rail-logo"><img src="assets/logo_cite.png" alt="CITE"
           onerror="this.parentNode.textContent='CT'"></div>
      <nav id="rail-nav" style="display:flex;flex-direction:column;gap:6px;align-items:center;"></nav>
      <div class="rail-spacer"></div>
      <div class="rail-user" title="Sesión">POI</div>
    </aside>

    <!-- PRINCIPAL -->
    <main class="main">
      <!-- HEADER -->
      <header class="topbar">
        <div>
          <div class="titlerow">
            <h1>Dashboard 2026</h1>
            <span class="pill-inst">CITE TEXTIL CAMÉLIDOS · CUSCO</span>
          </div>
          <div class="sub" id="view-sub">Plan Operativo Institucional · Seguimiento y monitoreo de metas</div>
        </div>
        <div class="brandmarks">
          <img src="assets/produce.png" alt="Ministerio de la Producción"
               onerror="this.style.display='none'">
          <div class="divider"></div>
          <img src="assets/itp.png" alt="ITP · Red CITE"
               onerror="this.style.display='none'">
        </div>
      </header>

      <!-- BARRA DE FILTROS (se completa desde app.js) -->
      <div class="filterbar" id="filterbar"></div>

      <!-- CONTENIDO -->
      <div class="content">
        <div class="view" id="view">
          <div class="state"><div class="box">
            <div class="spinner"></div>
            <h3>Cargando datos del POI…</h3>
            <p>Leyendo los archivos de <code>data/</code></p>
          </div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Librerías y aplicación (todo local, sin servidor de aplicación) -->
  <script src="js/lib/xlsx.full.min.js"></script>
  <script src="js/data.js?v=23"></script>
  <script src="js/metrics.js?v=23"></script>
  <script src="js/charts.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
</body>
</html>
